changelog:
  exclude:
    labels:
      - ignore-for-release
      - pre-commit.ci autofix
    authors:
      - dependabot
      - pre-commit-ci
  categories:
    - title: Bug Fixes
      labels:
        - bug
    - title: Enhancements
      labels:
        - enhancement
        - api
    - title: Documentation
      labels:
        - docs
    - title: Maintenance
      labels:
        - maint
        - CI/testing
        - deprecation
    - title: Other Changes
      labels:
        - "*"
